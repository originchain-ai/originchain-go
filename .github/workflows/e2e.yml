name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      # Live end-to-end smoke against the sdk-ci tenant. The command self-skips
      # (exits 0) when OC_BASE is unset, so forks without secrets stay green.
      - run: go run ./e2e
        env:
          OC_BASE: ${{ secrets.OC_BASE }}
          OC_BEARER: ${{ secrets.OC_BEARER }}
          OC_TENANT: ${{ secrets.OC_TENANT }}
          OC_NS: go_ci_${{ github.run_id }}
